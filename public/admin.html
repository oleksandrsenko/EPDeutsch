.ahard span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ahard em{font-style:normal;font-weight:800;color:var(--bad)}

.atable-w{overflow-x:auto;margin:0 -18px;padding:0 18px}
.atable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1100px}

// столбики (+ линия второго ряда); подписи дат — через одну-две, подсказка при наведении
function admChart(rows,key,opt){
  opt=opt||{};const W=640,H=160,pb=2,pt=8,n=rows.length,bw=W/n,max=Math.max(1,...rows.map(r=>Math.max(r[key],opt.line?r[opt.line]:0)));
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let bars="",pts=[],lbl="";const step=Math.ceil(n/5);
  rows.forEach((r,i)=>{const x=i*bw,h=(H-pt-pb)*(r[key]/max);
    bars+='<rect x="'+(x+bw*.18).toFixed(1)+'" y="'+y(r[key]).toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(r[key]?2:0,h).toFixed(1)+'" rx="3" class="ab"><title>'+admDate(r.day)+": "+r[key]+" "+(opt.unit||"")+(opt.line?" · "+r[opt.line]+" "+(opt.lunit||""):"")+"</title></rect>";
    if(opt.line)pts.push((x+bw/2).toFixed(1)+","+y(r[opt.line]).toFixed(1));
    if(i%step===0&&n-1-i>=step/2||i===n-1)lbl+='<span style="left:'+((i+.5)/n*100).toFixed(2)+'%">'+new Date(r.day*864e5).toLocaleDateString("ru-RU",{day:"numeric",month:"numeric",timeZone:"UTC"})+"</span>"});
  return'<svg class="achart" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(opt.title||"")+'"><line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" class="ax"/>'+bars+
    (opt.line?'<polyline points="'+pts.join(" ")+'" class="al"/>':"")+'</svg><div class="adays">'+lbl+"</div>";
}

  return'<div class="akpis">'+
      kp("Сегодня",usd(a.today.usd),admNum(a.today.req)+" "+plural(a.today.req,"запрос","запроса","запросов")+(a.today.errors?" · ошибок "+a.today.errors:""))+
      kp("За "+days+" дн.",usd(a.period.usd),admNum(a.period.req)+" "+plural(a.period.req,"запрос","запроса","запросов"))+
      kp("Бюджет на сегодня",Math.round(a.today.usd/L.siteDayUsd*100)+"%","из "+usd(L.siteDayUsd)+" в день")+
      kp("Подозрительная активность",a.blocks.length,a.blocks.length?"срабатываний за "+days+" дн.":"не было",a.blocks.length?"warn":"")+
    "</div>"+

      '<div class="aacc"><div><small>Роль</small><b>'+(ROLE_RU[u.role]||"Пользователь")+'</b></div><div><small>Вход</small><b>'+(u.blocked?"заблокирован":"разрешён")+(u.must_change_password?" · пароль временный":"")+'</b></div><div><small>Тариф</small><b><span class="aplan '+esc(u.plan)+'">'+(PLAN_RU[u.plan]||esc(u.plan))+"</span></b></div><div><small>Рассылка</small><b>"+(u.news?"получает":"отписан(а)")+"</b></div></div>"+
      admActions(u)+"</div>",()=>{},"Закрыть");
    $("#dlgNo").hidden=true;$("#dlg").classList.add("wide");
    $("#dlg").addEventListener("close",()=>{$("#dlgNo").hidden=false;$("#dlg").classList.remove("wide")},{once:true});
    ADM.cur=u;
  }catch(e){toast("⚠️ "+e.message)}
}

// действия админа над пользователем. Пароль никогда не показывается; сброс выдаёт временный пароль один раз.
function admActions(u){
  const mine=ME&&ME.id===u.id;
  const can=isAdmin()&&!u.owner&&!mine&&(u.role!=="admin"||isOwner());
  let h="";
  if(can)h+='<h4>Доступ</h4><div class="row aact"><button type="button" class="btn sm" data-admreset="'+u.id+'">'+ic("key",16)+'Сбросить пароль</button>'+
    '<button type="button" class="btn sm'+(u.blocked?"":" danger")+'" data-admblock="'+u.id+'" data-b="'+(u.blocked?0:1)+'">'+ic("shield",16)+(u.blocked?"Разблокировать вход":"Заблокировать вход")+'</button>'+
    (u.plan==="premium"?'<button type="button" class="btn sm" data-admplan="'+u.id+'" data-p="free">'+ic("crown",16)+'Вернуть тариф «Бесплатный»</button>':
      '<button type="button" class="btn sm" data-admplan="'+u.id+'" data-p="premium">'+ic("crown",16)+'Выдать Premium на 30 дней</button>')+
    '</div><p class="muted" style="margin:8px 0 0;font-size:13px">Сброс создаёт временный пароль и показывает его один раз. Пользователь обязан сменить его при следующем входе. Все действия записываются в журнал.</p>';
  if(isOwner()&&!u.owner)h+='<h4>Роль и права</h4><div class="row aact"><button type="button" class="btn sm" data-admrole="'+u.id+'" data-r="'+(u.role==="admin"?"user":"admin")+'">'+ic("shield",16)+(u.role==="admin"?"Убрать из админов":"Сделать админом")+'</button><button type="button" class="btn sm" data-admowner="'+u.id+'">'+ic("crown",16)+'Передать права владельца</button><button type="button" class="btn sm danger" data-admdel="'+u.id+'">'+ic("trash",16)+"Удалить аккаунт</button></div>"+
    '<p class="muted" style="margin:8px 0 0;font-size:13px">Админ видит всю админ-панель, может сбрасывать пароли, блокировать вход и менять тариф обычных пользователей, но не может менять роли и удалять аккаунты.</p>';
  if(u.owner)h+='<p class="muted" style="margin:12px 0 0">Это владелец сайта. Удалить его, сбросить пароль или снять роль нельзя, права можно только передать.</p>';
  else if(!can&&!isOwner())h+='<p class="muted" style="margin:12px 0 0">'+(mine?"Это твой аккаунт: пароль меняется в профиле.":"Этого пользователя может менять только владелец.")+'</p>';
  return h;
}
// временный пароль показывается один раз
function admShowTemp(u,pw){
  ask("Временный пароль для «"+u.name+"»",'<p style="margin-top:0">Передай его пользователю. <b>Больше он нигде не показывается</b>. При входе сайт заставит придумать свой пароль.</p><div class="atemp" style="font:700 22px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.04em;background:var(--bg2,#F6F7FB);border-radius:14px;padding:14px;text-align:center;word-break:break-all;user-select:all">'+esc(pw)+'</div><div class="row aact" style="margin-top:10px"><button type="button" class="btn sm" data-admcopy="'+esc(pw)+'">'+ic("copy",16)+"Скопировать</button></div>",()=>{},"Готово");
  $("#dlgNo").hidden=true;
  $("#dlg").addEventListener("close",()=>{$("#dlgNo").hidden=false},{once:true});
}
const AUDIT_RU={reset_password:"сбросил(а) пароль",set_role:"сменил(а) роль",set_plan:"сменил(а) тариф",block:"заблокировал(а) вход",unblock:"разблокировал(а) вход",transfer_owner:"передал(а) права владельца",delete_user:"удалил(а) аккаунт"};
async function admAudit(){
  try{
    const j=await api("GET","/admin/audit?limit=200");
    const rows=j.log.map(r=>"<tr><td>"+new Date(r.created*1000).toLocaleString("ru-RU")+"</td><td>"+esc(r.admin_name||("#"+r.admin_id))+"</td><td>"+esc(AUDIT_RU[r.action]||r.action)+"</td><td>"+esc(r.target_name||r.target_email||(r.target_user_id?("#"+r.target_user_id):"—"))+"</td><td><small>"+esc(Object.entries(r.details||{}).map(([k,v])=>k+": "+v).join(" · "))+"</small></td></tr>").join("");
    ask("Журнал действий администраторов",'<div class="atable-w"><table class="atable"><thead><tr><th>Когда</th><th>Кто</th><th>Что сделал(а)</th><th>С кем</th><th>Детали</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="muted">Пока пусто</td></tr>')+"</tbody></table></div><p class=\"muted\" style=\"font-size:13px\">Пароли в журнал не пишутся.</p>",()=>{},"Закрыть");
    $("#dlgNo").hidden=true;$("#dlg").classList.add("wide");
    $("#dlg").addEventListener("close",()=>{$("#dlgNo").hidden=false;$("#dlg").classList.remove("wide")},{once:true});
  }catch(e){toast("⚠️ "+e.message)}
}
// передача прав владельца: только с паролем текущего владельца; после этого ты становишься админом
function admOwner(u,err){
  ask("Передать права владельца «"+u.name+"»?",'<p style="margin-top:0">'+esc(u.name)+" станет владельцем: сможет удалять аккаунты, менять роли и передавать права дальше. Ты станешь админом и сможешь только смотреть. Вернуть права сможет только новый владелец.</p>"+'<label class="aform" style="max-width:none">Введи свой пароль для подтверждения<input type="password" id="admOwnPw" autocomplete="current-password"></label><p class="aerr" role="alert">'+esc(err||"")+"</p>",async()=>{
    try{await api("POST","/admin/user/"+u.id+"/owner",{password:$("#admOwnPw").value});const j=await api("GET","/me");ME=j.user;renderAcctBtn();toast("👑 Права переданы",u.name+" теперь владелец");renderAdmin()}catch(e){admOwner(u,e.message)}
  },"Передать права","Отмена");
}
// удаление аккаунта из админки: подтверждаем, вписав почту пользователя
function admDelete(u,err){
  ask("Удалить аккаунт «"+u.name+"»?",'<p style="margin-top:0">Удалятся <b>навсегда</b>: аккаунт, прогресс, статистика, свои наборы, друзья и общие ссылки. Отменить нельзя.</p><label class="aform" style="max-width:none">Для подтверждения впиши почту <b>'+esc(u.email)+'</b><input type="text" id="admDelMail" autocomplete="off"></label><p class="aerr" role="alert">'+esc(err||"")+"</p>",async()=>{
    const m=$("#admDelMail").value.trim();if(m.toLowerCase()!==u.email.toLowerCase())return admDelete(u,"Почта не совпадает");
    try{await api("DELETE","/admin/user/"+u.id,{email:m});toast("🗑️ Аккаунт удалён",u.email);renderAdmin()}catch(e){admDelete(u,e.message)}
  },"Удалить навсегда","Отмена");
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-admdays]");if(d){ADM.days=+d.dataset.admdays;renderAdmin();return}
  if(e.target.closest("[data-admrefresh]")){renderAdmin();return}
  if(e.target.closest("[data-admmails]")){const m=[...new Set(admFilterUsers().filter(u=>u.news).map(u=>(u.email||"").trim().toLowerCase()).filter(Boolean))];if(!m.length)return toast("Все отписались от писем");copyText(m.join(", "),"📋 Скопировано адресов: "+m.length);return}
  if(e.target.closest("[data-admhard]")){ADM.hardOpen=!ADM.hardOpen;lsSet("epd_admhard",ADM.hardOpen?"1":null);drawAdmin();return}
  if(e.target.closest("[data-admaudit]")){admAudit();return}
  const cp=e.target.closest("[data-admcopy]");if(cp){copyText(cp.dataset.admcopy,"📋 Пароль скопирован");return}
  const rs=e.target.closest("[data-admreset]");if(rs){e.preventDefault();const u=ADM.cur;$("#dlg").close();if(u)setTimeout(()=>ask("Сбросить пароль «"+u.name+"»?",'<p style="margin-top:0">Старый пароль перестанет работать, а все входы пользователя закроются. Ты увидишь временный пароль один раз, а пользователь сменит его при входе.</p>',async()=>{
      try{const j=await api("POST","/admin/user/"+u.id+"/reset");setTimeout(()=>admShowTemp(u,j.temp_password),80)}catch(er){toast("⚠️ "+er.message)}},"Сбросить пароль","Отмена"),60);return}
  const bl=e.target.closest("[data-admblock]");if(bl){e.preventDefault();api("POST","/admin/user/"+bl.dataset.admblock+"/block",{blocked:bl.dataset.b==="1"}).then(()=>{$("#dlg").close();toast(bl.dataset.b==="1"?"⛔ Вход заблокирован":"✅ Вход разрешён");renderAdmin()},er=>toast("⚠️ "+er.message));return}
  const pl=e.target.closest("[data-admplan]");if(pl){e.preventDefault();api("POST","/admin/user/"+pl.dataset.admplan+"/plan",{plan:pl.dataset.p,days:pl.dataset.p==="premium"?30:0}).then(()=>{$("#dlg").close();toast(pl.dataset.p==="premium"?"👑 Premium выдан на 30 дней":"Тариф «Бесплатный»");renderAdmin()},er=>toast("⚠️ "+er.message));return}
  const ro=e.target.closest("[data-admrole]");if(ro){e.preventDefault();api("POST","/admin/user/"+ro.dataset.admrole+"/role",{role:ro.dataset.r}).then(()=>{$("#dlg").close();toast(ro.dataset.r==="admin"?"🛡️ Теперь админ":"Больше не админ");renderAdmin()},er=>toast("⚠️ "+er.message));return}
  const ow=e.target.closest("[data-admowner]");if(ow){e.preventDefault();const u=ADM.cur;$("#dlg").close();if(u)setTimeout(()=>admOwner(u),60);return}
  const dl=e.target.closest("[data-admdel]");if(dl){e.preventDefault();const u=ADM.cur;$("#dlg").close();if(u)setTimeout(()=>admDelete(u),60);return}
  const so=e.target.closest("[data-admsort]");if(so){const k=so.dataset.admsort;ADM.dir=ADM.sort===k?-ADM.dir:-1;ADM.sort=k;$(".atable-w").outerHTML=admTable(admFilterUsers());return}
  const ur=e.target.closest("[data-admuser]");if(ur&&!e.target.closest("#dlg")){admUser(+ur.dataset.admuser)}
});

// запуск: только владелец и админы; остальным — вежливый отказ
function unmask(){const d=document.documentElement;const out=()=>{d.classList.add("bootout");setTimeout(()=>d.classList.remove("boot","bootout"),560)};setTimeout(()=>document.hidden?out():requestAnimationFrame(out),450)}
$("#themeBtn").onclick=()=>{const d=document.documentElement,dark=d.getAttribute("data-theme")==="dark"||(!d.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches),t=dark?"light":"dark";d.setAttribute("data-theme",t);try{const o=JSON.parse(localStorage.getItem("usd3-v1")||"{}");o.theme=t;localStorage.setItem("usd3-v1",JSON.stringify(o))}catch(e){}};
(async()=>{

  const el=$("#p-admin");
