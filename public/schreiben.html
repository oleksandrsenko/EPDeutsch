<style>
:root{
  --bg:#F6F7FB;--panel:#FFFFFF;--panel2:#EDEFF4;--hover:#F0F2FA;--fg:#282E3E;--muted:#586380;--line:#D9DDE8;--line2:#EDEFF4;
  --primary:#C4687A;--primary-h:#B25A6C;--primary-soft:#FAEEF1;--link:#A9566A;--on-primary:#fff;--oli:#DE8496;--oli-d:#C2647A;
  --good:#18AE79;--good-soft:#E3F7EF;--mid:#F28C28;--mid-soft:#FFF0E1;--bad:#E8505B;--bad-soft:#FFECE8;
  --c1:#7E6FB8;--c2:#3D7BF7;--c3:#18AE79;--c4:#F28C28;--c5:#E8505B;--mark:#FFF1B8;--pen:#C62828;
  --sh:0 .25rem 1rem 0 rgba(40,46,62,.08);--sh-card:0 .5rem 1.8rem 0 rgba(40,46,62,.14);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;--r-lg:26px;--acc-rgb:196,104,122;--yellow:#FFCD1F;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A092D;--panel:#2E3856;--panel2:#232B47;--hover:#39436A;--fg:#F6F7FB;--muted:#A8B1CF;--line:#4A5578;--line2:#39436A;
  --primary:#D98DA0;--primary-h:#E3A1B1;--primary-soft:#432A38;--link:#EDB2C0;
  --good:#3CCFA0;--good-soft:#18423A;--mid:#FFA95E;--mid-soft:#4A3420;--bad:#FF8A76;--bad-soft:#4A2A2A;
  --c1:#A092D6;--c2:#7FA6FF;--c3:#3CCFA0;--c4:#FFA95E;--c5:#FF7F87;--mark:#5A4A12;--pen:#FF8A80;
  --sh:0 .25rem 1rem 0 rgba(0,0,0,.35);--sh-card:0 .5rem 1.8rem 0 rgba(0,0,0,.5);--acc-rgb:217,141,160;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A092D;--panel:#2E3856;--panel2:#232B47;--hover:#39436A;--fg:#F6F7FB;--muted:#A8B1CF;--line:#4A5578;--line2:#39436A;
  --primary:#D98DA0;--primary-h:#E3A1B1;--primary-soft:#432A38;--link:#EDB2C0;
  --good:#3CCFA0;--good-soft:#18423A;--mid:#FFA95E;--mid-soft:#4A3420;--bad:#FF8A76;--bad-soft:#4A2A2A;
  --c1:#A092D6;--c2:#7FA6FF;--c3:#3CCFA0;--c4:#FFA95E;--c5:#FF7F87;--mark:#5A4A12;--pen:#FF8A80;
  --sh:0 .25rem 1rem 0 rgba(0,0,0,.35);--sh-card:0 .5rem 1.8rem 0 rgba(0,0,0,.5);--acc-rgb:217,141,160;color-scheme:dark}
*{box-sizing:border-box}
html::-webkit-scrollbar,.nav::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track,.nav::-webkit-scrollbar-track{background:var(--bg)}
.nav::-webkit-scrollbar-track{margin:8px 0}
html::-webkit-scrollbar-thumb,.nav::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.55);border-radius:999px;border:2px solid var(--bg);min-height:40px}
html::-webkit-scrollbar-thumb:hover,.nav::-webkit-scrollbar-thumb:hover{background:var(--primary)}
html::-webkit-scrollbar-button,.nav::-webkit-scrollbar-button{display:none;height:0}
@supports not selector(::-webkit-scrollbar){html,.nav{scrollbar-width:thin;scrollbar-color:rgba(var(--acc-rgb),.55) transparent}}
html{overflow-y:scroll}
.impuls,.qres{scrollbar-width:thin}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--link)}
/* ---------- шапка и меню: как в Wörter ---------- */
.top{position:sticky;top:0;z-index:30;height:66px;background:var(--panel);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.burger{display:inline-flex;border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;color:var(--muted)}
.home-de{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;background:var(--panel2);border-radius:12px;padding:6px 10px 6px 6px;font-weight:800;font-size:13px;color:var(--fg);text-decoration:none}
.home-de i{width:26px;height:18px;border-radius:5px;overflow:hidden;display:block}.home-de:hover{background:var(--hover)}
body.examing .ep-sf,body.examing .ep-sfbtn,body.examing .subnav{display:none!important}
.subnav{display:flex;align-items:center;gap:4px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{display:inline-flex;align-items:center;gap:8px;flex:none;padding:5px 12px 5px 5px;border-radius:12px;color:var(--fg);font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.subnav a:hover{background:var(--hover)}
.subnav .ni{--c:var(--primary);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.subnav .ni svg{width:16px;height:16px}
.subnav a.nav-ai .ni{background:linear-gradient(135deg,var(--primary),#8B5CF6);color:#fff}
.subnav a[aria-current="page"]{background:var(--primary-soft);color:var(--link)}
.subnav a[aria-current="page"] .ni{background:var(--c);color:#fff}
.subnav .sn-sp{flex:1;min-width:8px}
.subnav .burger{gap:6px;align-items:center;font-weight:700;font-size:13.5px;border:1px solid var(--line);padding:6px 10px}
.subnav .burger .bl{color:var(--fg)}
.subnav .n,.subnav small{display:none}
@media (max-width:640px){.subnav{display:none}}
.burger:hover{background:var(--hover);color:var(--fg)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:23px;letter-spacing:-.03em;white-space:nowrap;cursor:pointer;border:0;background:none;padding:0;color:var(--fg);text-decoration:none}
.logo .lg-t{display:flex;align-items:center;line-height:1;gap:9px}
.logo .lg-n{color:var(--fg)}.logo b{color:var(--link);font-weight:800}
.logo .lg-s{font-size:13px;font-weight:800;letter-spacing:.01em;color:var(--on-primary);background:var(--primary);border-radius:9px;padding:6px 9px;line-height:1}
.logo svg{overflow:visible;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.logo .lg-d{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.logo .lg-b{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.34,1.56,.64,1) .05s}
.logo:hover svg{transform:translateY(-2px)}.logo:hover .lg-d{transform:scale(.88) rotate(-6deg)}.logo:hover .lg-b{transform:scale(1.15)}
.search{position:relative;flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:999px;padding:0 16px;height:42px;color:var(--muted);border:2px solid transparent}
.search:focus-within{border-color:var(--primary);background:var(--panel)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:600;color:var(--fg);outline:none}
.search input::placeholder{color:var(--muted);font-weight:500}
.qres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border-radius:18px;box-shadow:var(--sh-card);padding:8px;display:none;max-height:420px;overflow:auto;z-index:5}
.qres.on{display:block}
.qres button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:none;border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;color:var(--fg)}
.qres button:hover,.qres button.on{background:var(--hover)}
.qres b{font-size:14.5px}.qres small{color:var(--muted);font-size:12.5px}
.qres .qh{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 12px 4px}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.streak{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--mid-soft);color:var(--mid);font-weight:800;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:15px;white-space:nowrap}
.streak.off{filter:grayscale(1);opacity:.65}
.hgoalbtn{position:relative;width:40px;height:40px;border:0;background:none;padding:0;cursor:pointer;flex:none}
.hgoalbtn svg{transform:rotate(-90deg)}
.hgoalbtn circle{transition:stroke-dashoffset .5s}
.hgoalbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.acct{display:inline-flex;border-radius:50%;text-decoration:none}
.uava{border-radius:50%;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
.shell{display:flex;min-height:calc(100vh - 66px);min-height:calc(100dvh - 66px);overflow-x:clip}
.nav{-webkit-font-smoothing:auto;width:264px;flex:none;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto;padding:14px 12px 20px;background:var(--bg);transition:margin-left .28s cubic-bezier(.3,.8,.3,1),opacity .2s}
.nav a,.nav .fold{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;color:var(--fg);font-weight:600;text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14.5px}
.nav a:hover,.nav .fold:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--link)}
.nav a .n{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.nav hr{border:0;border-top:1px solid var(--line);margin:12px 6px}
.nav .fold{font-weight:500;font-size:14px;padding:8px 14px}
.nav .fold svg{color:var(--muted)}
.lvl{margin:16px 4px 8px;background:var(--panel);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.lv-top{display:flex;align-items:center;gap:12px}
.lv-badge{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#F28C28);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(var(--acc-rgb),.35)}
.lv-top b{display:block;font-size:14.5px;font-weight:800;line-height:1.2}
.lv-top small{color:var(--muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.lv-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:12px;font-variant-numeric:tabular-nums}
.lvl .bar{height:8px;margin-top:8px}
.lvl .bar.xp i{background:linear-gradient(90deg,var(--primary),#F28C28)}
.lvl .bar.gd i{background:var(--good)}
.nav-legal{padding:14px 14px 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.veil{display:none}
main{flex:1;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:28px 24px 72px}
.pin{animation:pg .3s ease-out}
@media (min-width:981px){body.navhide .nav,html.navshut .nav{margin-left:-264px;opacity:0;pointer-events:none}}
@media (max-width:980px){
  .nav{position:fixed;left:0;top:66px;z-index:40;background:var(--panel);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh-card);border-radius:0 var(--r-lg) var(--r-lg) 0}
  body.navopen .nav{transform:none}
  body.navopen .veil{display:block;position:fixed;inset:66px 0 0;background:rgba(10,9,45,.35);z-index:35}
}
.tabbar{display:none}
h1{font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;margin:4px 0 6px;line-height:1.15;font-weight:800}
h2{font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--fg)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--link)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tag.s{background:var(--primary-soft);color:var(--link)}
.tag.e{background:color-mix(in srgb,var(--c2) 16%,transparent);color:var(--c2)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:99;transition:.3s;pointer-events:none;max-width:90vw}
.toast.on{transform:translate(-50%,0);opacity:1}
/* ---------- пробный экзамен ---------- */
.exbar{display:none;flex:1;align-items:center;gap:14px;min-width:0}
body.examing .exbar{display:flex}
body.examing .search,body.examing .tright,body.examing .burger,body.examing .nav,body.examing .tabbar{display:none!important}
body.examing .logo{pointer-events:none}
.exbar .ex-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.exbar .ex-t small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.exbar .sp{flex:1}
.ex-clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;padding:6px 14px;border-radius:12px;background:var(--panel2);display:inline-flex;align-items:center;gap:8px;transition:background .3s,color .3s}
.ex-clock.warn{background:var(--mid-soft);color:var(--mid)}
.ex-clock.crit{background:var(--bad-soft);color:var(--bad)}
.ex-viol{font-weight:800;padding:7px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:14px;white-space:nowrap}
.ex-viol.bad{background:var(--bad-soft);color:var(--bad)}
.ex-rules{display:grid;gap:10px;margin:18px 0;padding:0;list-style:none}
.ex-rules li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--panel2)}
.ex-rules li span:first-child{font-size:20px;line-height:1.2}
.ex-rules li small{display:block;color:var(--muted)}
.ex-pick{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ex-pick .panel{display:flex;flex-direction:column;gap:10px}
.ex-pick .itxt{font-size:15px;line-height:1.65;margin:0}
.ex-modal .panel{max-width:520px;text-align:center}
.ex-modal .em{font-size:46px}
.ex-log{display:grid;gap:6px;margin-top:10px;font-size:14px}
.ex-log div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--panel2)}
.ex-log b{font-variant-numeric:tabular-nums}
.ex-ok{background:var(--good-soft);color:var(--good)}
.ex-no{background:var(--bad-soft);color:var(--bad)}
@media (max-width:960px){.ex-pick{grid-template-columns:1fr}}
@media (max-width:640px){.exbar .ex-t{display:none}.ex-clock{font-size:18px;padding:5px 10px}}
/* ---------- главная: как в Wörter ---------- */
.hero{background:var(--panel);border-radius:var(--r-lg);padding:24px 26px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,205,31,.35),transparent 70%);pointer-events:none}
.hero-top{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font-size:clamp(20px,3vw,27px);margin:0}
.hero p{margin:4px 0 0;color:var(--muted)}
.hero-sub b{color:var(--fg)}
.btn.cta{background:var(--primary);border-color:var(--primary);color:#fff;padding:15px 26px;font-size:16.5px;border-radius:999px;box-shadow:0 10px 22px -10px rgba(var(--acc-rgb),.8)}
.btn.cta:hover{background:var(--primary-h)}
.hgoal{position:relative;z-index:1;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}
.hg-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:700;color:var(--muted)}
.hg-t b{color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums}
.hgoal .bar{height:10px;margin-top:9px}
.hgoal .bar i{background:var(--good)}
.hgoal.done .hg-t b{color:var(--good)}
.hfacts{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:14px;font-size:14px;font-weight:600;color:var(--muted)}
.hf{display:inline-flex;align-items:center;gap:6px}
.hf svg{color:var(--link)}
.hf a{color:var(--link);font-weight:700;text-decoration:none}
.hf-more{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--link);font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;font-size:14px}
.hf-more:hover{text-decoration:underline}
.h-sec{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:32px 0 14px;letter-spacing:-.01em;flex-wrap:wrap}
.h-sec small{font-size:13px;font-weight:600;color:var(--muted)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.rc{position:relative;display:flex;align-items:center;background:linear-gradient(135deg,var(--panel) 55%,var(--primary-soft));border:1.5px solid rgba(var(--acc-rgb),.22);border-radius:calc(var(--r) + 4px);box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s}
.rc:hover{transform:translateY(-2px);border-color:rgba(var(--acc-rgb),.5);box-shadow:0 12px 26px -12px rgba(var(--acc-rgb),.5),var(--sh)}
.rc-open{flex:1;min-width:0;display:flex;align-items:center;gap:16px;border:0;background:none;padding:18px;cursor:pointer;text-align:left;border-radius:inherit;color:inherit}
.ric{width:54px;height:54px;border-radius:17px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .18s;box-shadow:0 8px 16px -8px rgba(var(--acc-rgb),.8)}
.rc-open:hover .ric{transform:scale(1.08) rotate(-4deg)}
.rc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:800;font-size:17px;line-height:1.25;overflow:hidden}
.rc small{display:block;color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px}
.rc-open>span:nth-child(2){min-width:0;flex:1}
.rc-bar{display:block;height:6px;border-radius:99px;background:var(--panel2);margin-top:9px;overflow:hidden}
.rc-bar i{display:block;height:100%;border-radius:inherit;background:var(--good)}

.verdict.no{background:var(--bad-soft);color:var(--bad)}

.acct{position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.acct:hover{transform:scale(1.05)}

function go(v,arg,opt){
  if(VIEW==="write"&&v!=="write"&&W_STATE&&W_STATE.dirty&&!(opt&&opt.force)){W_STATE.dirty=false} // черновик и так в браузере
  if(EX&&EX.live&&!["exsel","exwrite","exam"].includes(v)){if(!confirm("Прервать экзамен? Работа не будет оценена, время уже идёт."))return;exAbort()}
  stopTimer();stopReview();closeSheet();hideTr();VIEW=v;ARG=arg;
  const navKey=v==="tasks"||v==="write"||v==="result"?"tasks-all":(TAB_OF[v]||v);
  document.body.classList.toggle("examing",v==="exsel"||v==="exwrite");
  document.body.dataset.view=v;
  $$(".nav [data-go],.tabbar [data-go],.subnav [data-go]").forEach(b=>{const k=b.dataset.go+(b.dataset.arg?"-"+b.dataset.arg:"");b.setAttribute("aria-current",k===navKey||(b.closest(".tabbar")&&k.split("-")[0]===navKey.split("-")[0])?"page":"false")});
  document.body.classList.remove("navopen");
  const m=$("#main");m.onclick=null;m.classList.remove("pin");void m.offsetWidth;m.classList.add("pin");
  ({home:rHome,theory:rTheory,tasks:rTasks,write:rWrite,result:rResult,fehler:rFehler,ftrain:rFTrain,hist:rHist,exam:rExam,exsel:rExSel,exwrite:rExWrite,acct:rAcct,friends:rFriends})[v](arg);
  // каждый раздел — шаг в истории: «Назад» в браузере и на телефоне возвращает в прошлый раздел, а не уводит из Schreiben
  const url="#"+v+(typeof arg==="string"?"="+arg:"");
  if(NAV_READY&&!(opt&&opt.pop)&&location.hash!==url)history.pushState({v},"",url);else history.replaceState({v},"",url);
  if(!(opt&&opt.keepScroll))window.scrollTo(0,0);updBadges();updTop();
}
let NAV_READY=false;
addEventListener("popstate",()=>{
  if(!NAV_READY)return;

const goal=()=>S.goal===1?1:2;
const dayTexts=d=>dayN("e",d);
function streak(){let t=today(),n=0;if(!dayTexts(t))t--;while(dayTexts(t)>0){n++;t--}return n}
const LVL=x=>Math.floor(Math.sqrt((x||0)/40))+1, LVX=l=>40*(l-1)*(l-1);

function updTop(){
  const n=dayTexts(today()),g=goal(),st=streak();

function chartSVG(ch,compact){
  if(!ch||ch.type==="none")return "";
  const cols=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"],u=esc(ch.unit||"");
  const num=v=>String(v).replace(".",",");
  if(ch.type==="bar"){
    const n=ch.labels.length,rowH=compact?13:36,lw=compact?0:230,W=560,H=n*rowH+8,max=Math.max(...ch.values)||1;
    if(compact)return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">${ch.values.map((v,i)=>`<rect x="0" y="${i*rowH+2}" width="${v/max*W}" height="${rowH-4}" rx="3" fill="${cols[0]}" opacity="${1-i*.07}"/>`).join("")}</svg>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Diagramm">${ch.labels.map((l,i)=>{const w=(W-lw-60)*ch.values[i]/max;return `<text x="${lw-10}" y="${i*rowH+rowH/2+5}" text-anchor="end" font-size="15" fill="var(--muted)">${esc(l)}</text><rect x="${lw}" y="${i*rowH+6}" width="${w}" height="${rowH-12}" rx="6" fill="${cols[0]}"><animate attributeName="width" from="0" to="${w}" dur=".7s" fill="freeze"/></rect><text x="${lw+w+8}" y="${i*rowH+rowH/2+5}" font-size="15" font-weight="800" fill="var(--fg)">${num(ch.values[i])}${u}</text>`}).join("")}</svg>`;
  }
  if(ch.type==="line"){
    const W=560,H=compact?80:260,pl=compact?4:40,pr=compact?4:16,pt=compact?4:16,pb=compact?4:30,all=ch.series.flatMap(s=>s.values),max=Math.max(...all)*1.12||1,n=ch.labels.length;
    const X=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),Y=v=>pt+(H-pt-pb)*(1-v/max);
    let g="";if(!compact){for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${num(Math.round(v*10)/10)}</text>`}g+=ch.labels.map((l,i)=>`<text x="${X(i)}" y="${H-8}" font-size="12" text-anchor="middle" fill="var(--muted)">${esc(l)}</text>`).join("")}
    const lines=ch.series.map((s,si)=>`<polyline fill="none" stroke="${cols[si%5]}" stroke-width="${compact?2:3}" stroke-linejoin="round" stroke-linecap="round" points="${s.values.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`+(compact?"":s.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${cols[si%5]}"><title>${esc(s.name)}: ${num(v)}${u}</title></circle>`).join(""))).join("");
    const leg=compact?"":`<div class="row" style="gap:14px;margin-top:6px;font-size:13px">${ch.series.map((s,si)=>`<span><i style="display:inline-block;width:12px;height:4px;border-radius:2px;background:${cols[si%5]};vertical-align:middle;margin-right:6px"></i>${esc(s.name)}</span>`).join("")}</div>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" ${compact?'height="100%" preserveAspectRatio="none"':""} role="img" aria-label="Liniendiagramm">${g}${lines}</svg>${leg}`;
  }
  return "";
}

function critBars(list){

function trend(){

/* ---------- ПЕРЕВОД ПО ВЫДЕЛЕНИЮ: выделил слово → перевод → в набор Wörter ---------- */
const TRC={};let trSel=null;
function attachTr(el){if(!el)return;el.classList.add("tr-zone");}
function hideTr(){$("#trPop")?.classList.remove("on");trSel=null}
function sentenceAround(node,txt){const all=(node.closest(".itxt,.paper,.ph,li,p")||node.closest(".tr-zone")||node).textContent||"";const i=all.indexOf(txt);if(i<0)return "";const a=Math.max(all.lastIndexOf(".",i),all.lastIndexOf("!",i),all.lastIndexOf("?",i))+1;let b=all.slice(i).search(/[.!?]/);b=b<0?all.length:i+b+1;return all.slice(a,b).trim().slice(0,300)}
async function showTr(){
  if(document.body.classList.contains("examing"))return;
  const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount){hideTr();return}
  const txt=sel.toString().replace(/\s+/g," ").trim().replace(/^[„“"«(]+|[.,;:!?„“"»)]+$/g,"");
  const node=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement);
  if(!node||!node.closest(".tr-zone")||!txt||txt.length>60||txt.split(" ").length>5||!/[A-Za-zÄÖÜäöüß]{2}/.test(txt)){hideTr();return}
  const rect=sel.getRangeAt(0).getBoundingClientRect(),p=$("#trPop");trSel={de:txt,ctx:sentenceAround(node,txt)};
  p.innerHTML=`<div class="tp-h"><b lang="de">${esc(txt)}</b><button class="tp-say" aria-label="Послушать">${ic("speaker",16)}</button></div><div class="tp-tr" id="tpTr"><span class="tp-dots"><i></i><i></i><i></i></span></div><div class="tp-a"><button class="btn sm pri" id="tpAdd" disabled>${ic("plus",15)}В Wörter</button><small>набор «Слова из текстов»</small></div>`;
  p.style.left=Math.max(8,Math.min(innerWidth-300,rect.left+rect.width/2-140))+"px";
  const below=rect.bottom+170<innerHeight;p.style.top=(below?rect.bottom+10:rect.top-10)+"px";p.classList.toggle("up",!below);p.classList.add("on");
  p.querySelector(".tp-say").onclick=()=>{try{const u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
  const key=txt.toLowerCase()+"|"+LANG;let tr=TRC[key];
  if(!tr&&LANG==="ru"&&!/\s/.test(txt)){await loadBook();const c=lookup(txt);if(c)tr=TRC[key]=c.ru+" · "+c.de.replace(/^(der|die|das)\s/,"$1 ")} // слово из словаря Wörter точнее машинного перевода
  if(!tr){try{tr=(await apiRoot("POST","/translate",{text:txt,from:"de",to:LANG})).text;TRC[key]=tr}catch(e){tr=null}}
  if(!trSel||trSel.de!==txt)return;
  const box=$("#tpTr");if(!box)return;
  if(!tr){box.innerHTML='<span class="muted">Перевод сейчас недоступен</span>';return}
  box.textContent=tr;trSel.ru=tr.split(" · ")[0];const add=$("#tpAdd");add.disabled=false;
  add.onclick=async()=>{add.disabled=true;try{await apiRoot("POST","/words",{de:trSel.de,ru:trSel.ru,ctx:trSel.ctx});add.innerHTML=ic("check",15,2.6)+"Добавлено";toast("📥 «"+trSel.de+"» уже ждёт тебя в Wörter","Набор «Слова из текстов» появится при следующем входе в Wörter")}catch(e){add.disabled=false;toast("⚠️ "+e.message)}};
}
document.addEventListener("mouseup",e=>{if(e.target.closest("#trPop"))return;setTimeout(showTr,10)});
document.addEventListener("touchend",e=>{if(e.target.closest("#trPop"))return;setTimeout(showTr,250)});
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s&&s.isCollapsed&&!$("#trPop:hover"))setTimeout(()=>{const s2=getSelection();if(s2&&s2.isCollapsed)hideTr()},150)});
addEventListener("scroll",()=>{if(trSel)hideTr()},{passive:true});

/* ---------- слова из Wörter прямо в тексте ---------- */
function loadBook(){
  if(BOOKMAP!==null)return Promise.resolve();BOOKMAP={};
  return new Promise(res=>{const s=document.createElement("script");s.src="/assets/book.js";s.onload=()=>{try{buildBook(window.BOOK||[])}catch(e){}res()};s.onerror=()=>res();document.head.append(s)});
}
function buildBook(book){
  if(!book.length&&typeof BOOK!=="undefined")book=BOOK; // BOOK объявлен через const в отдельном скрипте
  book.forEach(sec=>sec.sets.forEach(st=>st.items.forEach((it,i)=>{
    const id=sec.id+"/"+st.id+"/"+(st.keys?st.keys[i]:i);
    const de=it[0].replace(/\*/g,"").replace(/\(.*?\)/g,"").trim();
    const core=de.replace(/^(der|die|das|sich)\s+/i,"").trim();
    if(/\s/.test(core)||core.length<4)return;
    const k=core.toLowerCase();const stem=it[4]==="v"?k.replace(/(eln|ern|en|n)$/,""):k;
    if(stem.length<4)return;
    if(!BOOKMAP[stem])BOOKMAP[stem]={de:it[0].replace(/\*/g,""),ru:it[1],id,v:it[4]==="v"};
  })));
}
function lookup(w){const k=w.toLowerCase();if(k.length<4)return null;if(BOOKMAP[k])return BOOKMAP[k];for(let cut=1;cut<=3;cut++){const s=k.slice(0,-cut);if(s.length>=4&&BOOKMAP[s])return BOOKMAP[s]}return null}
async function markBook(el){
  await loadBook();if(!el||!el.isConnected||!BOOKMAP||!Object.keys(BOOKMAP).length)return;
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("mark,.kom,sup")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const parts=n.nodeValue.split(/([A-Za-zÄÖÜäöüß]{4,})/);if(parts.length<2)return;let hit=false;
    const frag=document.createDocumentFragment();parts.forEach((p,i)=>{const c=i%2?lookup(p):null;if(c){hit=true;const s=document.createElement("span");const b=MYB[c.id];s.className="ww"+(b&&b[0]>=3?" kn":"");s.dataset.de=c.de;s.dataset.ru=c.ru;s.dataset.st=b?(b[0]>=3?"выучено в Wörter":"учишь в Wörter"):"есть в словаре Wörter";s.textContent=p;frag.append(s)}else frag.append(p)});
    if(hit)n.replaceWith(frag)});
}
document.addEventListener("mouseover",e=>{const w=e.target.closest(".ww"),p=$("#pop");if(!w){p.classList.remove("on");return}
  p.innerHTML=`<b>${esc(w.dataset.de)}</b>${esc(w.dataset.ru)}<small>${esc(w.dataset.st)}</small>`;const r=w.getBoundingClientRect();
  p.style.left=Math.min(innerWidth-330,Math.max(8,r.left))+"px";p.style.top=(r.bottom+8+120>innerHeight?r.top-p.offsetHeight-8:r.bottom+8)+"px";p.classList.add("on")});

let TS=null;
function startTour(){TS={i:0};document.body.classList.add("touring");tourShow()}
function endTour(){const o=$("#tour");if(o)o.remove();document.body.classList.remove("touring","navopen");applyNav();TS=null;S.tourDone=1;save()}
function tourShow(){
  const st=TOUR[TS.i];let o=$("#tour");if(!o){o=document.createElement("div");o.id="tour";o.innerHTML='<div class="tour-hl" id="tourHl"></div><div class="tour-card" id="tourCard" role="dialog" aria-live="polite"></div>';document.body.append(o);o.onclick=e=>{if(e.target===o)return}}
  const mobile=innerWidth<=980,wasHidden=document.body.classList.contains("navhide");document.body.classList.toggle("navopen",!!(st.nav&&mobile));if(!mobile)document.body.classList.toggle("navhide",!st.nav);const moved=st.nav&&mobile||!mobile&&wasHidden!==!st.nav;
  const card=$("#tourCard"),hl=$("#tourHl");
  card.innerHTML=`<div class="tc-top"><span class="tc-oli">${mascot(st.mood||"happy",64)}</span><div><b>${esc(st.t)}</b><p>${esc(st.x)}</p></div></div><div class="tc-dots">${TOUR.map((_,i)=>`<i class="${i===TS.i?"on":i<TS.i?"seen":""}"></i>`).join("")}<span>${TS.i+1} из ${TOUR.length}</span></div><div class="tc-f">${TS.i<TOUR.length-1?`<button class="btn ghost sm" id="tcSkip">Пропустить</button>`:""}<span class="sp"></span>${TS.i?`<button class="btn sm" id="tcBack">Назад</button>`:""}<button class="btn pri sm" id="tcNext">${TS.i===TOUR.length-1?"Начать!":"Дальше"}</button></div>`;
  if(!TS.shown){card.classList.add("in");TS.shown=1}
  const place=()=>{const el=st.s&&$(st.s);if(!el||!el.offsetParent||!el.getBoundingClientRect().width){hl.style.opacity=0;card.style.left="50%";card.style.top="50%";card.style.transform="translate(-50%,-50%)";o.classList.add("dim");return}
    o.classList.remove("dim");const r=el.getBoundingClientRect(),pad=6;hl.style.opacity=1;Object.assign(hl.style,{left:r.left-pad+"px",top:r.top-pad+"px",width:r.width+pad*2+"px",height:r.height+pad*2+"px"});
    const cw=Math.min(360,innerWidth-24),ch=card.offsetHeight||200;let x=r.right+16,y=r.top-10;
    if(x+cw>innerWidth-12){x=Math.min(innerWidth-cw-12,Math.max(12,r.left+r.width/2-cw/2));y=r.bottom+14;if(y+ch>innerHeight-12)y=Math.max(12,r.top-ch-14)}
    y=Math.max(12,Math.min(innerHeight-ch-12,y));card.style.transform="none";card.style.left=x+"px";card.style.top=y+"px"};
  TS.place=place;setTimeout(place,moved?340:30);
  $("#tcNext").onclick=()=>{if(TS.i>=TOUR.length-1){endTour();confetti(50);return}TS.i++;tourShow()};
  $("#tcBack")&&($("#tcBack").onclick=()=>{TS.i--;tourShow()});
  $("#tcSkip")&&($("#tcSkip").onclick=endTour);
}
let tourRz=0;addEventListener("resize",()=>{if(!TS||!TS.place)return;cancelAnimationFrame(tourRz);tourRz=requestAnimationFrame(()=>TS&&TS.place&&TS.place())}); // только двигаем, не перерисовываем: иначе на телефоне кнопки «убегают»
addEventListener("keydown",e=>{if(TS&&e.key==="Escape")endTour();if(e.key==="Escape"){hideTr();if(document.body.classList.contains("sheetopen"))toggleSheet(false)}});

/* ---------- запуск: маска загрузки снимается, когда страница уже отрисована ---------- */
function unmask(){const d=document.documentElement;if(!d.classList.contains("boot"))return;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));const fonts=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,wait(1200)]):Promise.resolve();
  const out=()=>{d.classList.add("bootout");setTimeout(()=>d.classList.remove("boot","bootout"),560)};
  Promise.all([fonts,wait(500)]).then(()=>{let done=false;const o=()=>{if(!done){done=true;out()}};requestAnimationFrame(()=>requestAnimationFrame(o));setTimeout(o,150)})} // в фоновой вкладке кадров нет — не ждём их
setTimeout(unmask,7000);
(async()=>{
  try{const me=await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json());if(!me.user){location.replace("/");return}ME=me.user;LANG=ME.lang||"ru";MYB=(me.progress||{}).b||{};drawMe()}catch(e){}
  try{const [w,a]=await Promise.all(["wendungen","aufgaben"].map(n=>fetch("/data/schreiben/"+n+".json").then(r=>r.json())));W=w;A=a}catch(e){toast("⚠️ Не удалось загрузить задания","Проверь интернет и обнови страницу")}
  try{const st=await api("GET","state");AI=st.ai;
    if(st.data&&(!S.t||(st.data.t||0)>S.t))S=Object.assign(S,st.data);
    else if(S.t&&(!st.data||(st.data.t||0)<S.t)){clearTimeout(syncT);syncT=setTimeout(pushState,800)} // на устройстве новее: досылаем
    fixExam();ESSAYS=st.essays.map(e=>Object.assign(e,{crit:e.crit||(S.crit||{})[e.id]}));
  }catch(e){toast("⚠️ "+e.message)}
  if(!S.recent||!S.recent.length)S.recent=S.lastTask?[S.lastTask]:[];
  if(EX&&EX.live){exEv("reload");if(exLeft()<=0){NAV_READY=true;unmask();exFinish(true);return}exRun();go("exam");NAV_READY=true;unmask();return}
  if(EX&&!EX.live){EX=null;try{localStorage.removeItem(EXK)}catch(e){}}
  const h=location.hash.slice(1).split("=");
  if(h[0]==="friend"&&h[1]){history.replaceState(null,"","#friends");await addFriend(h[1]);go("friends")}
  else go(["home","theory","tasks","fehler","hist","exam","acct","friends"].includes(h[0])?h[0]:h[0]==="write"&&h[1]?"write":"home",h[1]);
  NAV_READY=true;unmask();
  checkAch();
  if(!S.tourDone&&!ESSAYS.length)setTimeout(startTour,1300);
})();
