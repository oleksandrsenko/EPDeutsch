<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<script>
(function(){var d=document.documentElement;d.classList.add("boot");try{var o=JSON.parse(localStorage.getItem("usd3-v1")||"{}");if(o.theme)d.setAttribute("data-theme",o.theme)}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="/ep.js"></script>
<style>
:root{
  --bg:#F6F7FB;--panel:#FFFFFF;--panel2:#EDEFF4;--hover:#F0F2FA;--fg:#282E3E;--muted:#586380;--line:#D9DDE8;--line2:#EDEFF4;
  --primary:#0E8C7F;--primary-h:#0B7569;--primary-soft:#DDF3EF;--link:#0B7569;--oli:#2BB3A3;--oli-d:#159283;
  --good:#18AE79;--good-soft:#E3F7EF;--mid:#F28C28;--mid-soft:#FFF0E1;--bad:#E8505B;--bad-soft:#FFECE8;--mark:#FFF1B8;
  --c-w:#7E6FB8;--c-s:#C4687A;--c-g:#F28C28;--c-l:#3D7BF7;--c-h:#0EA5B7;--c-sp:#18AE79;--c-f:#E8505B;--c-p:#E0A800;
  --sh:0 .25rem 1rem 0 rgba(40,46,62,.08);--sh-card:0 .6rem 2rem 0 rgba(40,46,62,.16);
  --r:18px;--r-lg:26px;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A092D;--panel:#2E3856;--panel2:#232B47;--hover:#39436A;--fg:#F6F7FB;--muted:#A8B1CF;--line:#4A5578;--line2:#39436A;
  --primary:#3BC2B2;--primary-h:#5AD3C4;--primary-soft:#173F3C;--link:#7FDDD1;--good:#3CCFA0;--good-soft:#18423A;--mid-soft:#4A3420;--bad-soft:#4A2630;--mark:#5A4B12;
  --c-w:#A092D6;--c-s:#D98DA0;--c-g:#FFA95E;--c-l:#7FA6FF;--c-h:#4FCFE0;--c-sp:#3CCFA0;--c-f:#FF7F88;--c-p:#FFC94D;
  --sh:0 .25rem 1rem 0 rgba(0,0,0,.35);--sh-card:0 .6rem 2rem 0 rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A092D;--panel:#2E3856;--panel2:#232B47;--hover:#39436A;--fg:#F6F7FB;--muted:#A8B1CF;--line:#4A5578;--line2:#39436A;
  --primary:#3BC2B2;--primary-h:#5AD3C4;--primary-soft:#173F3C;--link:#7FDDD1;--good:#3CCFA0;--good-soft:#18423A;--mid-soft:#4A3420;--bad-soft:#4A2630;--mark:#5A4B12;
  --c-w:#A092D6;--c-s:#D98DA0;--c-g:#FFA95E;--c-l:#7FA6FF;--c-h:#4FCFE0;--c-sp:#3CCFA0;--c-f:#FF7F88;--c-p:#FFC94D;
  --sh:0 .25rem 1rem 0 rgba(0,0,0,.35);--sh-card:0 .6rem 2rem 0 rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--link)}
button{font:inherit;color:inherit}
svg{flex:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)}
/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:30;height:66px;background:var(--panel);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.home{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;background:var(--panel2);border-radius:12px;padding:6px 10px 6px 6px;font-weight:800;font-size:13px;color:var(--fg);text-decoration:none}
.home i{width:26px;height:18px;border-radius:5px;overflow:hidden;display:block}
.home:hover{background:var(--hover)}
.uwrap{flex:none;display:flex;align-items:center;gap:10px;margin-left:auto}
.ubtn{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;display:inline-flex}
.cdchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 13px;background:color-mix(in srgb,var(--c-p) 16%,transparent);color:var(--fg);font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.cdchip svg{color:var(--c-p)}.cdchip small{font-weight:700;color:var(--muted);font-size:12.5px}
.subnav{display:flex;align-items:center;gap:4px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{display:inline-flex;align-items:center;gap:8px;flex:none;padding:5px 12px 5px 5px;border-radius:12px;color:var(--fg);font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.subnav a:hover{background:var(--hover)}
.subnav .ni{--c:var(--muted);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.subnav a[aria-current="page"]{background:color-mix(in srgb,var(--c) 12%,transparent)}
.subnav a[aria-current="page"] .ni{background:var(--c);color:#fff}
.subnav .sn-sp{flex:1;min-width:8px}
.tabbar{display:none}
@media (max-width:640px){
  .subnav{display:none}.cdchip small{display:none}.top{gap:8px;padding:0 10px;height:58px}.home span{display:none}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:45;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line2);padding:4px max(4px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
  .tabbar a,.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;border-radius:14px;color:var(--muted);font:inherit;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none}
  .tabbar svg{width:22px;height:22px}
  .tabbar [aria-current="page"]{color:var(--c,var(--link))}
  .tabbar [aria-current="page"]::before{content:"";position:absolute;top:2px;width:28px;height:3px;border-radius:9px;background:var(--c,var(--primary))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
.uava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800}
main{max-width:1160px;margin:0 auto;padding:26px 24px 90px}
.page{animation:pageIn .3s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.12;margin:6px 0 8px;letter-spacing:-.02em}
h2{font-size:21px;margin:30px 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:18px 0 8px}
.lead{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:720px}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none}
.crumb:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;padding:9px 16px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--c,var(--primary));border-color:var(--c,var(--primary));color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh);padding:22px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;background:var(--panel2);color:var(--muted);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.lv{background:color-mix(in srgb,var(--c,var(--primary)) 14%,transparent);color:var(--c,var(--primary))}
.tag.ok{background:var(--good-soft);color:var(--good)}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--primary));border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
input[type=text],input[type=date],input[type=password],input:not([type]),select,textarea{border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--c,var(--primary))}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* ---------- обзор ---------- */
/* главная: как в Schreiben */
.hero{background:var(--panel);border-radius:var(--r-lg);padding:24px 26px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,205,31,.35),transparent 70%);pointer-events:none}
.hero-top{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.hero-l{display:flex;align-items:center;gap:16px;min-width:0}
.hero h1{font-size:clamp(22px,3vw,30px);margin:0}
.hero-sub{margin:4px 0 0;color:var(--muted)}.hero-sub b{color:var(--fg)}
.btn.cta{background:var(--primary);border-color:var(--primary);color:#fff;padding:15px 26px;font-size:16.5px;border-radius:999px;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--primary) 80%,transparent)}
.btn.cta:hover{background:var(--primary-h);border-color:var(--primary-h)}
.hgoal{position:relative;z-index:1;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}
.hg-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
.hg-t b{color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hgoal.done .hg-t b{color:var(--good)}
.hgoal>.bar{height:10px;margin-bottom:12px}.hgoal>.bar i{background:var(--good)}
.hfacts{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--muted)}
.hf{display:inline-flex;align-items:center;gap:6px}.hf svg{color:var(--link)}.hf b{color:var(--fg)}
.hf a{color:var(--link);font-weight:700;text-decoration:none}
.hf-more{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--link);font-weight:700;text-decoration:none}
.hf-more:hover{text-decoration:underline}
.todo{display:flex;flex-direction:column;gap:6px}
.hgoal .todo{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.todo a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;text-decoration:none;color:var(--fg);transition:background .15s}
.todo a:hover{background:var(--hover)}
.todo .ck{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;transition:.2s}
.todo a.done .ck{background:var(--good);border-color:var(--good)}
.todo a.done b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.todo b{font-weight:700;font-size:14.5px;display:block}
.todo small{color:var(--muted);font-size:12.5px;display:block}
.todo .mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.todo .tx{flex:1;min-width:0}
.h-sec{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:32px 0 14px;letter-spacing:-.01em;flex-wrap:wrap}
.h-sec small{font-size:13px;font-weight:600;color:var(--muted)}
@media (max-width:760px){.hgoal .todo{grid-template-columns:1fr}.hero{padding:20px}.hero-cta,.btn.cta{width:100%}.hf-more{margin-left:0}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mod{--c:var(--primary);position:relative;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:22px;padding:20px;box-shadow:var(--sh);color:inherit;text-decoration:none;border:2px solid transparent;overflow:hidden;min-height:170px;transition:transform .25s,box-shadow .25s,border-color .25s}
.mod::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:var(--c);opacity:.09;transition:transform .5s}
.mod:hover{transform:translateY(-3px);box-shadow:var(--sh-card);border-color:var(--c)}
.mod:hover::after{transform:scale(1.35)}
.mod .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff}
.mod h3{margin:4px 0 0;font-size:19px}
.mod p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.mod .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.frei-banner{--c:var(--c-f);margin-top:18px;display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 70%);border-radius:24px;padding:22px 24px;box-shadow:var(--sh);text-decoration:none;color:inherit;border:2px solid transparent;transition:transform .25s,box-shadow .25s,border-color .25s}
.frei-banner:hover{transform:translateY(-3px);box-shadow:var(--sh-card);border-color:var(--c)}
.frei-banner .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.frei-banner h3{margin:0;font-size:21px}
.frei-banner p{margin:4px 0 0;color:var(--muted)}
/* ---------- списки ---------- */
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{position:relative;display:flex;flex-direction:column;gap:8px;background:linear-gradient(135deg,var(--panel) 58%,color-mix(in srgb,var(--c) 9%,var(--panel)));border-radius:22px;padding:18px 48px 18px 20px;box-shadow:var(--sh);text-decoration:none;color:inherit;border:1.5px solid color-mix(in srgb,var(--c) 20%,transparent);transition:transform .18s,border-color .18s,box-shadow .18s}
.item::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.4px solid var(--c);border-top:2.4px solid var(--c);transform:translateY(-50%) rotate(45deg);opacity:.55;transition:transform .18s,opacity .18s}
.item:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 12px 26px -12px color-mix(in srgb,var(--c) 50%,transparent),var(--sh)}
.item:hover::after{opacity:1;transform:translate(3px,-50%) rotate(45deg)}
.item h3{margin:0;font-size:17px;line-height:1.3}
.item p{margin:0;color:var(--muted);font-size:14px}
.item .row{gap:6px}
.lvl-h{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.lvl-h::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:inline-flex;background:var(--panel2);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button,.tabs a{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:none;font-size:14px}
.tabs .on{background:var(--panel);color:var(--fg);box-shadow:var(--sh)}
/* ---------- грамматика ---------- */
.theory{font-size:15.5px;line-height:1.65}
.theory h3{font-size:17px;margin:22px 0 8px}
.theory table{border-collapse:collapse;margin:10px 0;width:100%;font-size:14.5px}
.theory td,.theory th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.theory th{background:var(--panel2)}
.theory .ex{background:var(--panel2);border-radius:12px;padding:10px 14px;margin:8px 0;font-family:var(--serif);font-size:16px}
.theory .ex b,.theory b.k{color:var(--c,var(--primary))}
.theory .tip{border-left:4px solid var(--c,var(--primary));background:color-mix(in srgb,var(--c,var(--primary)) 8%,transparent);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0}
.ex-run{max-width:760px}
.qcard{background:var(--panel);border-radius:24px;box-shadow:var(--sh);padding:24px}
.qcard .task{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.qcard .q{font-family:var(--serif);font-size:20px;line-height:1.5;margin-bottom:16px}
.qcard .q .gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--c,var(--primary));margin:0 3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:11px 14px;cursor:pointer;font-weight:600;transition:.15s}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--c,var(--primary));background:color-mix(in srgb,var(--c,var(--primary)) 8%,transparent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt kbd{font:inherit;font-size:12px;font-weight:800;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);flex:none}
.ansin{width:100%;font-size:17px!important;padding:12px 14px!important}
.start-hint{font-size:13.5px;color:var(--muted);margin:-8px 0 8px;font-weight:600}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}.fb.ai{background:var(--panel2)}
.fb b.h{display:block;margin-bottom:4px}
.fb .model{font-family:var(--serif);font-size:16.5px}
.progline{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.progline .bar{flex:1}
.stufen{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.stufe{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13.5px}
.stufe.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.stufe small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.summary{text-align:center;padding:30px}
.summary .big{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--c)}
/* ---------- чтение ---------- */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.article{background:var(--panel);border-radius:24px;box-shadow:var(--sh);padding:30px 34px}
.article .kicker{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.article h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.2vw,34px);margin:8px 0 10px}
.article .alead{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.5;margin:0 0 16px}
.article .meta{font-size:13px;color:var(--muted);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.article p.pa{font-family:var(--serif);font-size:18px;line-height:1.72;margin:0 0 14px;position:relative}
.article p.pa .pn{position:absolute;left:-26px;top:3px;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted)}
.article ::selection{background:color-mix(in srgb,var(--c) 30%,transparent)}
.article .looked{background:var(--mark);border-radius:3px}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:6px}

.pop{position:absolute;z-index:120;background:var(--panel);border-radius:16px;box-shadow:0 18px 40px -12px rgba(10,9,45,.45);padding:12px 14px;max-width:300px;font-size:14px;border:1px solid var(--line2);animation:pageIn .15s}

.mic:hover{transform:scale(1.05)}

@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.rec .rt{flex:1;min-width:180px}

/* ---------- карточки (свободный) ---------- */
.flash{max-width:620px;margin:0 auto}
.fcard{perspective:1200px;cursor:pointer;margin-bottom:16px}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border-radius:26px;box-shadow:var(--sh-card);padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}

.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.deck-l{display:flex;flex-direction:column;gap:2px;margin-top:14px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

<body>

  <script>document.write(EP.burger("deBurger","Меню").replace("<button",'<button data-ep-drawer'))</script>
  <span id="logo" style="display:contents"></span>
  <script>document.write(EP.searchField())</script>
  <div class="uwrap"><a class="cdchip" href="#/plan" id="cdChip" hidden></a><a class="ubtn" href="#/settings" id="ubtn" title="Настройки"></a></div>
</header>

<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,s)=>EP.icon(n,s);
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const dayOf=ts=>Math.floor((ts*1000-new Date(ts*1000).getTimezoneOffset()*60000)/864e5);
const dateToDay=s=>{if(!s)return null;const d=new Date(s+"T12:00:00");return isNaN(d)?null:Math.floor((d-d.getTimezoneOffset()*60000)/864e5)};
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
async function api(p,o={}){
  const r=await fetch("/api"+p,{credentials:"same-origin",...o,headers:{"Content-Type":"application/json","X-USD":"1",...(o.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){location.href="/";throw new Error("auth")}
  if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));
  return j;
}
// ---------- состояние ----------
const ST={state:{},keys:{},user:null,me:null};
const DATA={};
async function data(area,name){const k=area+"/"+name;if(!DATA[k])DATA[k]=fetch("/data/"+k+".json",{credentials:"same-origin"}).then(r=>r.ok?r.json():{}).catch(()=>({}));return DATA[k]}
const get=(k,d)=>ST.state[k]===undefined?d:ST.state[k];
const pend={};
function save(k,v){
  ST.state[k]=v;
  try{localStorage.setItem("de-st:"+k,JSON.stringify(v))}catch(e){}
  clearTimeout(pend[k]);pend[k]=setTimeout(()=>flush(k),700);
}
function flush(k,keep){clearTimeout(pend[k]);delete pend[k];return fetch("/api/de/state/"+k,{method:"PUT",credentials:"same-origin",keepalive:!!keep,headers:{"Content-Type":"application/json","X-USD":"1"},body:JSON.stringify({v:ST.state[k]})}).catch(()=>{})}
addEventListener("pagehide",()=>Object.keys(pend).forEach(k=>flush(k,true)));
function logDone(kind,val){
  const L=get("log",{}),t=today(),d=L[t]||(L[t]={});
  if(kind==="l"||kind==="h"){d[kind]=d[kind]||[];if(!d[kind].includes(val))d[kind].push(val)}
  else d[kind]=(d[kind]||0)+(val||1);
  Object.keys(L).forEach(x=>{if(+x<t-120)delete L[x]});
  save("log",L);
}
const todayLog=()=>get("log",{})[today()]||{};
// ---------- озвучка ----------
let curAudio=null;
function stopAudio(){if(curAudio){curAudio.pause();curAudio=null}try{speechSynthesis.cancel()}catch(e){}}
function deVoices(){try{return speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang))}catch(e){return[]}}
function bestVoice(i){const v=deVoices();if(!v.length)return null;const good=v.filter(x=>/Premium|Enhanced|Neural|Natural|Google|Anna|Petra|Markus|Yannick|Helena|Katja|Conrad/i.test(x.name));const pool=good.length?good:v;return pool[(i||0)%pool.length]}
function browserSay(text,vi,rate){return new Promise(ok=>{try{const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";const v=bestVoice(vi);if(v)u.voice=v;u.rate=rate||.97;u.onend=u.onerror=()=>ok();speechSynthesis.speak(u)}catch(e){ok()}})}
async function say(text,opt={}){
  stopAudio();
  if(ST.keys.openai){
    try{const r=await api("/de/tts",{method:"POST",body:JSON.stringify({text,voice:opt.voice||"sage",style:opt.style||""})});
      if(r.url){const a=new Audio(r.url);curAudio=a;await a.play().catch(()=>{});return new Promise(ok=>{a.onended=ok;a.onerror=ok})}}catch(e){toast(e.message)}
  }
  return browserSay(text,opt.vi||0,opt.rate);
}
// ---------- шапка ----------
// [ключ, подпись, адрес, иконка, цвет] — вторая строка шапки: разделы EPD или «Свободного»
const SUB_EPD=[["home","Обзор","#/","home","var(--primary)"],["grammatik","Grammatik","#/grammatik","gram","var(--c-g)"],["lesen","Lesen","#/lesen","book","var(--c-l)"],["hoeren","Hören","#/hoeren","ear","var(--c-h)"],["sprechen","Sprechen","#/sprechen","mic","var(--c-sp)"],["plan","План","#/plan","cal","var(--c-p)"],["settings","Настройки","#/settings","gear","var(--muted)"]];
const SUB_FREI=[["karten","Карточки","#/frei/karten","cards","var(--c-f)"],["grammatik","Грамматика","#/frei/grammatik","gram","var(--c-g)"],["lesen","Lesen","#/frei/lesen","book","var(--c-l)"],["hoeren","Hören","#/frei/hoeren","ear","var(--c-h)"],["sprechen","Sprechen","#/frei/sprechen","mic","var(--c-sp)"],["videos","Видео","#/frei/videos","video","var(--c-f)"]];
function header(cur){
  const k=cur||"home",h=(location.hash||"#/").slice(1).split("/").filter(Boolean),frei=k==="frei";
  const on=frei?(h[1]||"karten"):(h[0]||"home"),sub=frei?SUB_FREI:SUB_EPD;
  $("#logo").innerHTML=EP.logo(k==="settings"?"home":k,frei?"#/frei":"#/");
  const link=([key,t,href,i,c])=>`<a href="${href}" style="--c:${c}"${key===on?' aria-current="page"':""}><span class="ni">${EP.icon(i,16)}</span>${t}</a>`;
  $("#subnav").innerHTML=(frei?`<a href="#/frei" style="--c:var(--c-f)"${h.length===1?' aria-current="page"':""}><span class="ni">${EP.icon("star",16)}</span>Свободный</a>`:"")+sub.map(link).join("");

function checkQ(skip){

      try{const r=await api("/de/check",{method:"POST",body:JSON.stringify({task:"Satzfortsetzung: ergänze den Satz sinnvoll und grammatisch korrekt",q:q.q,a:q.a,answer:ans})});mark(r.ok?1:0);

  const fb=$("#fb");

   ${!ok&&!skip&&ans&&q.t!=="mc"&&ST.keys.anthropic?`<div class="row" style="margin-top:10px"><button class="btn sm" id="aiChk">${ic("star",14)} Мой вариант тоже может быть верным — проверить с ИИ</button></div>`:""}</div>`;
  const ai=$("#aiChk");if(ai)ai.onclick=async()=>{ai.disabled=true;ai.innerHTML='<span class="spin"></span> Проверяю…';
    try{const r=await api("/de/check",{method:"POST",body:JSON.stringify({task:q.task||"",q:q.q,a:q.a,answer:ans})});
      if(r.ok){G.st.r[i]=1;save(gramKey(),G.st);G.ok++;G.retry=G.retry.filter(x=>x!==i)}
      fb.insertAdjacentHTML("beforeend",`<div class="fb ${r.ok?"ok":"ai"}"><b class="h">${r.ok?"ИИ: твой вариант верный ✓":"ИИ: есть ошибка"}</b>${r.ok?"":`<div class="model">${esc(r.fixed)}</div>`}<div style="margin-top:4px">${esc(r.why)}</div></div>`);ai.remove()}
    catch(e){ai.disabled=false;ai.textContent=e.message}};

function nextQ(){
  G.pos++;

// ---------- перевод выделенного слова ----------
let POP=null,LOOK=null;
function closePop(){if(POP){POP.remove();POP=null}}
function sentenceAround(text,word){const i=text.indexOf(word);if(i<0)return text.slice(0,300);let a=text.lastIndexOf(".",i),b=text.indexOf(".",i+word.length);a=a<0?0:a+1;b=b<0?text.length:b+1;return text.slice(a,b).trim().slice(0,400)}
function bindLookup(root,side){
  LOOK={root,side,list:[]};
  const handler=()=>setTimeout(()=>{
    const sel=getSelection();if(!sel||sel.isCollapsed)return;
    const txt=sel.toString().replace(/\s+/g," ").trim().replace(/^[„“"«(\[]+|[.,;:!?“”"»)\]]+$/g,"");
    if(!txt||txt.length>60||txt.split(" ").length>5||!root.contains(sel.anchorNode))return;
    const p=sel.anchorNode.parentElement.closest("p,div");
    lookup(txt,sentenceAround(p?p.textContent:txt,txt),sel.getRangeAt(0).getBoundingClientRect());
  },10);
  root.addEventListener("mouseup",handler);root.addEventListener("touchend",handler);
  root.addEventListener("dblclick",handler);
}
// перевод — в окошке прямо у выделенного слова: сразу DeepL, потом (если есть ключ Claude) пояснение по контексту
async function lookup(word,sentence,rect){
  const box=LOOK&&LOOK.side;
  closePop();POP=document.createElement("div");POP.className="pop wpop";POP.setAttribute("role","dialog");POP.setAttribute("aria-label","Перевод");document.body.appendChild(POP);
  const place=()=>{if(!POP)return;const w=POP.offsetWidth,hh=POP.offsetHeight;let x=rect.left+rect.width/2-w/2;x=Math.max(10,Math.min(innerWidth-w-10,x));
    const below=rect.bottom+10+hh<innerHeight||rect.top<hh+20;POP.classList.toggle("up",!below);
    POP.style.left=(x+scrollX)+"px";POP.style.top=(below?rect.bottom+10:rect.top-hh-10)+scrollY+"px";
    POP.style.setProperty("--ax",Math.max(16,Math.min(w-16,rect.left+rect.width/2-x))+"px")};
  let R={};
  const draw=(state)=>{if(!POP)return;const tr=R.tr||"",ctx=R.tr_ctx&&R.tr_ctx.toLowerCase()!==tr.toLowerCase()?R.tr_ctx:"";
    POP.innerHTML=`<div class="wp-h"><span class="w">${esc(word)}</span>${R.lemma&&R.lemma.toLowerCase()!==word.toLowerCase()?`<span class="lem">${esc(R.lemma)}</span>`:""}<button class="wp-x" aria-label="Закрыть">${ic("x",14)}</button></div>`+
      (state==="load"?'<div class="ph"><span class="spin"></span> перевожу…</div>':state==="err"?`<div class="ph">${esc(R.err||"Не удалось перевести")}</div>`:
      `<div class="tr">${esc(tr)}</div>${R.provider?`<div class="prov">${esc(R.provider)}</div>`:""}${ctx?`<div class="ctx"><b>В этом предложении:</b> ${esc(ctx)}</div>`:""}${R.note?`<div class="nt">${esc(R.note)}</div>`:""}${state==="more"?'<div class="ph" style="margin-top:6px"><span class="spin"></span> пояснение по контексту…</div>':""}
      <div class="acts"><button class="btn sm" data-say aria-label="Озвучить">${ic("speaker",16)}</button><button class="btn sm" data-add>+ в карточки Wörter</button></div>`);
    place();
    POP.querySelector(".wp-x").onclick=closePop;
    const sb=POP.querySelector("[data-say]");if(sb)sb.onclick=()=>say(R.lemma||word);
    const ab=POP.querySelector("[data-add]");if(ab)ab.onclick=async()=>{try{await api("/words",{method:"POST",body:JSON.stringify({de:R.lemma||word,ru:R.tr_ctx||R.tr,ctx:sentence})});ab.textContent="✓ добавлено";ab.disabled=true;toast("Слово появится в наборе Wörter")}catch(e){toast(e.message)}};
  };
  const remember=()=>{const tr=R.tr_ctx||R.tr;if(!tr)return;
    if(LOOK&&!LOOK.list.some(x=>x.w===word)){LOOK.list.unshift({w:word,tr});const vl=box&&box.querySelector(".vlist");if(vl)vl.innerHTML=LOOK.list.slice(0,30).map(x=>`<div><b>${esc(x.w)}</b><span>${esc(x.tr)}</span></div>`).join("")}
    const V=get("vocab",[]),i=V.findIndex(x=>x.w===word);if(i<0)V.unshift({w:word,tr,l:R.lemma||"",d:today()});else V[i]=Object.assign(V[i],{tr,l:R.lemma||V[i].l});save("vocab",V.slice(0,500))};
  draw("load");
  const me=POP;
  try{R=await api("/de/ctx",{method:"POST",body:JSON.stringify({word,sentence,explain:false})})}catch(e){R={err:e.message}}
  if(POP!==me)return;
  if(R.err&&!ST.keys.anthropic){draw("err");return}
  remember();
  if(!ST.keys.anthropic){draw("done");return}
  draw(R.tr?"more":"load");
  try{const r2=await api("/de/ctx",{method:"POST",body:JSON.stringify({word,sentence})});R=Object.assign({},R,r2,{tr:R.tr||r2.tr,provider:R.provider||r2.provider})}catch(e){}
  if(POP!==me)return;
  if(!R.tr&&!R.tr_ctx){R.err=R.err||"Не удалось перевести";draw("err");return}
  remember();draw("done");
}

function tasksHTML(tasks,ans,checked){
  return tasks.map((q,i)=>{
    const a=ans[i];let body="";
    if(q.t==="tf"){const L=[["r","richtig"],["f","falsch"],["n","nicht im Text"]].filter(x=>q.two?x[0]!=="n":true);
      body=`<div class="seg">${L.map(([v,t])=>`<button data-q="${i}" data-v="${v}" class="${a===v?"sel":""} ${checked?(v===q.a?"right":a===v?"wrong":""):""}">${t}</button>`).join("")}</div>`}
    else if(q.t==="mc")body=`<div class="mco">${q.o.map((o,k)=>`<button data-q="${i}" data-v="${k}" class="${a===k?"sel":""} ${checked?(k===q.a?"right":a===k?"wrong":""):""}">${String.fromCharCode(97+k)}) ${esc(o)}</button>`).join("")}</div>`;
    else if(q.t==="open")body=`<textarea data-q="${i}" placeholder="Кратко, по-немецки" ${checked?"readonly":""}>${esc(a||"")}</textarea>`;
    else if(q.t==="head")body=q.paras.map((pn,k)=>`<div class="row" style="margin:4px 0;flex-wrap:nowrap"><b style="min-width:62px;font-size:13px">Absatz ${pn}</b><select data-q="${i}" data-k="${k}" ${checked?"disabled":""}><option value="">—</option>${q.heads.map((h,hi)=>`<option value="${hi}" ${a&&a[k]===hi?"selected":""}>${String.fromCharCode(65+hi)}) ${esc(h)}</option>`).join("")}</select>${checked?(a&&a[k]===q.a[k]?' ✓':` <span style="color:var(--bad);font-weight:800;white-space:nowrap">→ ${String.fromCharCode(65+q.a[k])}</span>`):""}</div>`).join("");
    else if(q.t==="gap")body=`<input data-q="${i}" value="${esc(a||"")}" ${checked?"readonly":""} style="width:100%">`;
    let why="";
    if(checked){const right=taskRight(q,a);
      why=`<div class="why">${q.t==="open"||q.t==="gap"?`<b>Ответ:</b> ${esc(Array.isArray(q.a)?q.a.join(" / "):q.a)}<br>`:""}${q.ex?esc(q.ex):""}${q.t==="open"?' <span class="muted">Сверь сам — засчитай, если смысл совпадает.</span>':""}</div>`;
      if(q.t!=="open"&&q.t!=="head")why=(right?'<div class="why" style="color:var(--good);font-weight:800">✓ верно</div>':'<div class="why" style="color:var(--bad);font-weight:800">✗ неверно</div>')+why}
    return `<div class="tq"><div class="qt"><span class="qn">${i+1}.</span>${esc(q.q)}</div>${body}${why}</div>`;
  }).join("");
}
function taskRight(q,a){
  if(q.t==="tf"||q.t==="mc")return a===q.a;
  if(q.t==="gap")return (Array.isArray(q.a)?q.a:[q.a]).map(loose).includes(loose(a||""));
  if(q.t==="head")return 0;
  return null;
}
function taskScore(tasks,ans){let s=0,m=0;tasks.forEach((q,i)=>{if(q.t==="open")return;if(q.t==="head"){q.a.forEach((x,k)=>{m++;if(ans[i]&&ans[i][k]===x)s++});return}m++;if(taskRight(q,ans[i]))s++});return [s,m]}
function bindTasks(root,tasks,ans,onChange){
  root.querySelectorAll("button[data-q]").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,q=tasks[i];ans[i]=q.t==="mc"?+b.dataset.v:b.dataset.v;onChange()});
  root.querySelectorAll("textarea[data-q],input[data-q]").forEach(t=>t.oninput=()=>{ans[+t.dataset.q]=t.value});
  root.querySelectorAll("select[data-q]").forEach(s=>s.onchange=()=>{const i=+s.dataset.q;ans[i]=ans[i]||[];ans[i][+s.dataset.k]=s.value===""?null:+s.value});
}

const REC={active:false,rec:null,chunks:[],stream:null,sr:null,live:"",
  async start(){
    this.chunks=[];this.live="";this.active=true;
    if(ST.keys.openai&&window.MediaRecorder){
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
      this.rec=new MediaRecorder(this.stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
      this.rec.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data)};this.rec.start(1000);this.mode="cloud";
    }else{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){this.active=false;throw new Error("Браузер не умеет распознавать речь. Добавь ключ OpenAI в настройках или напиши ответ текстом.")}
      this.sr=new SR();this.sr.lang="de-AT";this.sr.continuous=true;this.sr.interimResults=true;this.final="";
      this.sr.onresult=e=>{let fin="",tmp="";for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+" ";else tmp+=e.results[i][0].transcript}this.final=fin;this.live=fin+tmp;const el=$("#liveTx");if(el)el.textContent=this.live};
      this.sr.onend=()=>{if(this.active&&this.mode==="browser"){try{this.sr.start()}catch(e){}}};
      this.sr.start();this.mode="browser";
    }
  },
  async stop(){
    this.active=false;
    if(this.mode==="cloud"){
      await new Promise(ok=>{this.rec.onstop=ok;this.rec.stop()});this.stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(this.chunks,{type:this.rec.mimeType||"audio/webm"});
      const b64=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.readAsDataURL(blob)});
      return (await api("/de/stt",{method:"POST",body:JSON.stringify({audio:b64,mime:blob.type})})).text;
    }
    try{this.sr.stop()}catch(e){}
    await new Promise(r=>setTimeout(r,400));
    return (this.live||this.final||"").trim();
  },
  cancel(){this.active=false;try{this.rec&&this.rec.state!=="inactive"&&this.rec.stop()}catch(e){}try{this.stream&&this.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{this.sr&&this.sr.stop()}catch(e){}}
};

  const w=await data("frei","wendungen"),dk=(w.decks||[]).find(x=>x.id===id);
  if(!dk){page('<div class="empty">Колода не найдена</div>');return}
  document.body.style.setProperty("--c",dk.color||"var(--c-f)");
  const key="k-"+id;let st=get(key,{});
  let queue=dueCards(dk,st),pos=0,mode="list";
  const draw=()=>{
    if(mode==="list"){page(`${crumb("#/frei","Свободный немецкий")}<h1>${esc(dk.title)}</h1><p class="lead">${esc(dk.ru||"")}${dk.warn?`<br><b>${esc(dk.warn)}</b>`:""}</p>
      <div class="row"><button class="btn primary" id="learn" ${queue.length?"":"disabled"}>Учить · ${queue.length} на сегодня</button><button class="btn" id="all">Все карточки по кругу</button></div>
      <div class="deck-l">${dk.cards.map((c,i)=>`<div><b>${esc(c.de)}</b><span>${esc(c.ru)}</span><small>${st[i]?(st[i][0]>=3?"✓ знаю":"учу"):""}</small></div>`).join("")}</div>`);
      $("#learn").onclick=()=>{mode="card";pos=0;draw()};$("#all").onclick=()=>{queue=dk.cards.map((c,i)=>i);for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}mode="card";pos=0;draw()};return}
    if(pos>=queue.length){page(`${crumb("#/frei","Свободный немецкий")}<div class="card summary"><div class="big">✓</div><p>На сегодня всё! Следующие повторения придут по расписанию.</p><button class="btn primary" id="back">К колоде</button></div>`);$("#back").onclick=()=>{queue=dueCards(dk,st);mode="list";draw()};return}
    const i=queue[pos],c=dk.cards[i];
    page(`${crumb("#/frei/karten/"+id,dk.title)}<div class="flash" style="margin-top:14px"><div class="progline"><div class="bar"><i style="width:${pos/queue.length*100}%"></i></div><small class="muted">${pos+1}/${queue.length}</small></div>
      <div class="fcard" id="fc"><div class="fin"><div class="face"><div class="big">${esc(c.de)}</div>${c.ex?`<div class="exs">${esc(c.ex)}</div>`:""}<span class="hint">нажми или пробел — перевернуть</span></div><div class="face back"><div class="big">${esc(c.ru)}</div>${c.note?`<div class="nt">${esc(c.note)}</div>`:""}${c.ex_ru?`<div class="exs">${esc(c.ex_ru)}</div>`:""}</div></div></div>
      <div class="fbtns"><button class="btn again" id="again">Ещё раз <small>(1)</small></button><button class="btn know" id="know">Знаю <small>(2)</small></button></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="sayc">${ic("speaker",16)}Произнести</button></div></div>`);
    $("#fc").onclick=()=>$("#fc").classList.toggle("flip");
    $("#sayc").onclick=()=>say(c.de,{voice:"ash",style:"Sprich locker und umgangssprachlich wie ein junger Wiener."});
    const ans=ok=>{const s=st[i]||[0,0];s[0]=ok?Math.min(s[0]+1,INT.length-1):0;s[1]=today()+(ok?INT[s[0]]:0);st[i]=s;save(key,st);logDone("f",1);if(!ok)queue.push(i);pos++;draw()};
    $("#again").onclick=()=>ans(false);$("#know").onclick=()=>ans(true);
  };
  draw();
  const kh=e=>{if(!location.hash.startsWith("#/frei/karten/")){removeEventListener("keydown",kh);return}if(mode!=="card"||!$("#fc"))return;if(e.key===" "){e.preventDefault();$("#fc").classList.toggle("flip")}else if(e.key==="1")$("#again").click();else if(e.key==="2")$("#know").click()};
  addEventListener("keydown",kh);
}

// ---------- План ----------
async function vPlan(){
  header("plan");setC("var(--c-p)");
  const p=get("plan",{});if(!p.start){p.start=today();save("plan",p)}
  const [{items,w,rec},gr]=await Promise.all([todayList(),data("de","grammatik")]);
  const L=get("log",{}),t=today();
  const daysHTML=Array.from({length:28},(_,k)=>{const d=t-27+k,x=L[d]||{};const n=(x.g?1:0)+((x.l||[]).length?1:0)+((x.h||[]).length?1:0)+(x.s?1:0)+(x.f?1:0);return `<i class="${n>=4?"l3":n>=2?"l2":n?"l1":""}" title="${new Date((d)*864e5).toLocaleDateString("ru-RU")}"></i>`}).join("");
  const wk=Math.floor((t-p.start)/7);
  const weeks=Array.from({length:6},(_,k)=>{const n=wk+k;return {n,topic:TOPICS[((n%TOPICS.length)+TOPICS.length)%TOPICS.length],from:p.start+n*7}});
  const exam=dateToDay(p.epd);
  page(`<h1>План</h1><p class="lead">Укажи даты — план на каждый день соберётся сам: сколько карточек, какая грамматика, какой текст и аудио. Сложность растёт от B2 к C1 по мере прохождения.</p>
  <div class="pgrid">
   <div class="card"><h2 style="margin-top:0">Даты</h2>
     <div class="field"><label>Письменный EPD</label><input type="date" id="pEpd" value="${esc(p.epd||"")}"></div>
     <div class="field"><label>Bonustest 1 (Grammatik, 2 Lesetexte, Erörterung)</label><input type="date" id="pBt1" value="${esc(p.bt1||"")}"></div>
     <div class="field"><label>Bonustest 2 (Strukturen, Hören, Stellungnahme)</label><input type="date" id="pBt2" value="${esc(p.bt2||"")}"></div>
     <div class="field"><label>Карточек Wörter в день</label><select id="pWords"><option value="">авто (${wordTarget({...w})})</option>${[20,25,30,35,40,50].map(n=>`<option ${p.words==n?"selected":""}>${n}</option>`).join("")}</select></div>
     <button class="btn primary" id="pSave">Сохранить</button>
   </div>
   <div class="card"><h2 style="margin-top:0">Сегодня</h2>${todoHTML(items)}</div>
  </div>
  <div class="pgrid" style="margin-top:18px">
   <div class="card"><h2 style="margin-top:0">Темы по неделям</h2><p class="muted" style="margin-top:0;font-size:14px">Каждую неделю — одна из 10 тем экзамена: Lesen, Hören и Sprechen подбираются по ней.${exam&&exam>t?` До экзамена ${exam-t} ${plural(exam-t,"день","дня","дней")} — успеешь пройти все темы ${Math.max(1,Math.floor((exam-t)/70))} ${plural(Math.max(1,Math.floor((exam-t)/70)),"раз","раза","раз")}.`:""}</p>
    <div class="week">${weeks.map((x,k)=>`<div class="${k===0?"cur":""}"><b>${k===0?"Эта неделя":new Date(x.from*864e5).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}</b>${esc(x.topic)}<small>${esc(TOPIC_RU[x.topic]||"")}</small></div>`).join("")}</div></div>
   <div class="card"><h2 style="margin-top:0">Последние 4 недели</h2><div class="days" style="grid-template-columns:repeat(14,1fr)">${daysHTML}</div><p class="muted" style="font-size:13px">Чем темнее, тем больше модулей в этот день.</p>
    <h2>Формат</h2>
    <table class="pts"><tr><td><b>Bonustest 1</b> · 135 мин</td><td>55</td></tr><tr><td>Grammatik: Konjunktiv II Perfekt (5), Passiversatzformen (4), Partizipialkonstruktionen / Relativsätze (6)</td><td>15</td></tr><tr><td>Zwei Lesetexte</td><td>20</td></tr><tr><td>Erörterung, 200–220 Wörter</td><td>20</td></tr><tr><td><b>Bonustest 2</b> · 135 мин</td><td>55</td></tr><tr><td>Nominal → Verbal (6), Satzfortsetzungen (9)</td><td>15</td></tr><tr><td>Hörverstehen</td><td>15</td></tr><tr><td>Stellungnahme, 230–250 Wörter (2 темы на выбор)</td><td>25</td></tr></table>
    <p class="muted" style="font-size:13px;line-height:1.5">Оценка: 51–55 → 1, 45–50 → 2, 39–44 → 3, 33–38 → 4, ≤32 → 5. Минимум по частям: BT1 — GR 7/15, LV 10/20, TP 10/20; BT2 — GR 7/15, HV 5/15, TP 12/25. Средняя двух тестов не хуже 4,0, второй тест не отрицательный, посещаемость от 70 %. Тогда письменный EPD не нужен — только устный (но регистрироваться на EPD всё равно надо).</p></div>
  </div>`);
  $("#pSave").onclick=()=>{const q=get("plan",{});q.epd=$("#pEpd").value;q.bt1=$("#pBt1").value;q.bt2=$("#pBt2").value;q.words=+$("#pWords").value||0;save("plan",q);toast("План сохранён");vPlan()};
}

// ---------- Настройки ----------
async function vSettings(){
  header("settings");setC();
  const s=await api("/de/settings");
  const K=[["anthropic","Claude (Anthropic)","Разбор Sprechen, проверка заданий, пояснение слов, Schreiben, «Практика» в Wörter","sk-ant-…"],["openai","OpenAI","Живые голоса в Hören и Sprechen, распознавание твоей речи","sk-…"],["deepl","DeepL","Перевод выделенных слов (без него — Claude или MyMemory)","…:fx"]];
  page(`<h1>Настройки</h1><p class="lead">Ключи хранятся только на твоём компьютере (папка db/) и никуда не отправляются, кроме самих сервисов.</p>
  <div class="pgrid">
   <div class="card"><h2 style="margin-top:0">Ключи API</h2>${K.map(([k,n,d,ph])=>`<div class="keyrow"><div><span class="dot ${s.keys[k]?"on":""}"></span><b>${n}</b><div class="muted" style="font-size:12.5px">${d}</div></div>${s.owner?`<input type="password" id="k_${k}" placeholder="${s.keys[k]?"ключ сохранён — вставь новый, чтобы заменить":ph}" autocomplete="off">`:`<span class="muted">${s.keys[k]?"подключён":"нет"}</span>`}${s.owner?`<button class="btn sm" data-key="${k}">Сохранить</button>`:"<span></span>"}</div>`).join("")}
    <p class="muted" style="font-size:13px;margin-bottom:0">Расходы ИИ: сегодня $${s.spent_today}, за 30 дней $${s.spent_month} (предохранитель: $${s.budget_day} в день). Модели: разговор — ${esc(s.models.talk)}, слова и проверка — ${esc(s.models.ctx)}, голос — ${esc(s.models.tts)}, речь — ${esc(s.models.stt)}.</p></div>
   <div class="card"><h2 style="margin-top:0">Приглашения для друзей</h2>${s.owner?`<p class="muted" style="margin-top:0;font-size:14px">Регистрация закрыта для всех. Создай код и отдай другу — он введёт его при регистрации на стартовой странице. Код одноразовый.</p><button class="btn primary sm" id="newInv">+ Новый код</button><div style="margin-top:10px">${(s.invites||[]).map(i=>`<div class="inv"><code>${esc(i.code)}</code>${i.used?`<span class="muted">использовал(а): ${esc(i.used_name||"—")}</span>`:`<span class="muted">свободен</span><button class="btn sm" data-delinv="${esc(i.code)}" style="margin-left:auto">Удалить</button>`}</div>`).join("")||'<div class="muted">Кодов пока нет</div>'}</div>`:`<p class="muted">Приглашения создаёт владелец.</p>`}
    <h2>Аккаунт</h2><div class="row"><a class="btn sm" href="/woerter#acct">Профиль и аватар</a><a class="btn sm" href="/woerter#friends">Друзья и рейтинг</a><button class="btn sm" id="theme">Сменить тему</button><button class="btn sm" id="logout">Выйти</button></div></div>
  </div>`);
  $$("[data-key]").forEach(b=>b.onclick=async()=>{const k=b.dataset.key,v=$("#k_"+k).value.trim();if(!v){toast("Вставь ключ");return}try{await api("/de/settings/key",{method:"POST",body:JSON.stringify({name:k,value:v})});toast("Ключ сохранён");await loadState();vSettings()}catch(e){toast(e.message)}});
  const ni=$("#newInv");if(ni)ni.onclick=async()=>{try{const r=await api("/de/invites",{method:"POST"});try{await navigator.clipboard.writeText(r.code)}catch(e){}toast("Код "+r.code+" скопирован");vSettings()}catch(e){toast(e.message)}};
  $$("[data-delinv]").forEach(b=>b.onclick=async()=>{await api("/de/invites/"+b.dataset.delinv,{method:"DELETE"});vSettings()});
  $("#logout").onclick=async()=>{try{await api("/logout",{method:"POST"})}catch(e){}location.href="/"};
  $("#theme").onclick=()=>{const d=document.documentElement,cur=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),nx=cur==="dark"?"light":"dark";d.setAttribute("data-theme",nx);try{const o=JSON.parse(localStorage.getItem("usd3-v1")||"{}");o.theme=nx;localStorage.setItem("usd3-v1",JSON.stringify(o))}catch(e){}};
}

// ---------- старт ----------
async function loadState(){
  const [s,me]=await Promise.all([api("/de/state"),api("/me").catch(()=>null)]);
  ST.state=s.state||{};ST.keys=s.keys||{};ST.user=s.user;ST.me=me;
  // если запись на сервер не успела уйти (закрыли вкладку), берём локальную копию поновее
  try{Object.keys(localStorage).filter(k=>k.startsWith("de-st:")).forEach(k=>{const key=k.slice(6),v=JSON.parse(localStorage.getItem(k));if(ST.state[key]===undefined){ST.state[key]=v;save(key,v)}})}catch(e){}
}
(async()=>{
  try{await loadState()}catch(e){EP.ready();return}
  try{speechSynthesis.getVoices()}catch(e){}
  await route();
  document.body.classList.add("ready");EP.ready();
})();
</script>
</body>
